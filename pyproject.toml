[project]
name = "luminekit-checks"
version = "0.0.0"
description = "Repository-only validation for the LumineKit skill collection"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["PyYAML>=6,<7", "markdown-it-py>=4,<5", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["scripts/vendor", "tests/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
